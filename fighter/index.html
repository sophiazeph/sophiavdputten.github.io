<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Choose Your Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: arcade select screen — fighter on a mossy stage left, symbol rack right; stacks on phone. Single dark look by choice. */
:root{
  --night:#0c1a33; --moss:#13284d; --moss-2:#1c3a6b; --line:#2e548c;
  --lichen:#c6dd7f; --rose:#f29ac4; --ink:#eef2e3; --muted:#a6b6d2;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,52px);line-height:1;margin:0;color:var(--lichen);letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.note{background:var(--moss);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.stage{background:radial-gradient(ellipse at 50% 85%,var(--moss-2),var(--moss) 60%);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
@media (max-width:760px){.stage{position:static}}
.stage svg{display:block;width:100%;max-height:58vh;height:auto}
.skin{display:flex;align-items:center;gap:10px;margin-top:8px}
#skinSw{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--lichen);box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--lichen)}
.sw:focus-visible{outline:3px solid var(--lichen);outline-offset:2px}
.name{display:flex;gap:8px;margin-top:8px}
.name input{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 12px;font:inherit}
.name input:focus{outline:2px solid var(--lichen);outline-offset:1px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{font-family:var(--display);font-size:13px;letter-spacing:.04em;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--lichen);color:var(--night);border-color:var(--lichen)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rose);margin-left:6px;vertical-align:middle}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{position:relative;background:var(--moss);border:2px solid var(--line);border-radius:12px;padding:10px 8px 10px;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .12s,border-color .12s}
.item:hover{transform:translateY(-2px);border-color:var(--lichen)}
.item:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--lichen);outline-offset:2px}
.item svg{width:72px;height:72px}
.item span{font-size:14px;line-height:1.25}
.item.on{border-color:var(--rose)}
.item.on::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--rose);font-weight:700}
.summary{margin-top:20px;background:var(--moss);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.summary h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 8px;color:var(--lichen)}
.summary dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0 0 12px}
.summary dt{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.summary dd{margin:0}
.empty{color:var(--muted);font-style:italic}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:2px solid var(--lichen)}
.btn.primary{background:var(--lichen);color:var(--night)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.warn{background:transparent;color:var(--rose);border-color:var(--rose)}
dialog{background:var(--moss);color:var(--ink);border:2px solid var(--lichen);border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));max-height:86vh}
dialog::backdrop{background:rgba(5,10,7,.72)}
.dlg{padding:18px 20px 20px;overflow:auto;max-height:86vh}
.dlg-top{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.dlg-top svg{width:96px;height:96px;flex:none;background:var(--night);border-radius:12px;padding:6px}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.dlg h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:2px 0 0;color:var(--lichen);text-wrap:balance}
.dlg h4{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--rose);margin:14px 0 2px}
.dlg p{margin:0;max-width:62ch}
.dlg .tf{border-left:3px solid var(--lichen);padding-left:10px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

.hint{margin:0 0 10px;font-size:14px;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.item .nm{font-size:13px;line-height:1.2;color:var(--muted)}
.rv-head{margin-bottom:12px}
.rv-title{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.4vw,30px);line-height:1.1;margin:4px 0 0;color:var(--lichen);text-wrap:balance}
.card{display:grid;perspective:1200px;min-height:360px}
.card .face{grid-area:1/1;border-radius:18px;border:2px solid var(--line);background:var(--moss);color:var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .75s cubic-bezier(.3,.7,.2,1);padding:22px}
.card .front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;font:inherit;background:radial-gradient(ellipse at 50% 40%,var(--moss-2),var(--moss) 70%)}
.card .front:hover{border-color:var(--lichen)}
.card .front:focus-visible{outline:3px solid var(--lichen);outline-offset:3px}
.card .front svg{width:min(190px,48vw);height:min(190px,48vw)}
.flip-cue{font-family:var(--display);font-size:14px;letter-spacing:.06em;color:var(--night);background:var(--lichen);border-radius:999px;padding:8px 18px}
.card .back{transform:rotateY(180deg);display:flex;flex-direction:column;gap:12px;border-color:var(--rose)}
.card.flipped .front{transform:rotateY(-180deg)}
.card.flipped .back{transform:rotateY(0)}
.back-top{display:flex;gap:14px;align-items:center}
.back-top svg{width:76px;height:76px;flex:none;background:var(--night);border-radius:12px;padding:6px}
.back h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:2px 0 0;color:var(--lichen);text-wrap:balance}
#cText{max-width:62ch}#cText p{margin:0 0 10px}.card .back{overflow:auto}
#cText.todo{color:var(--muted);font-style:italic}
.dots{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--rose)}
.dots span.done{background:var(--lichen)}
.rv-actions{justify-content:center;min-height:46px}
.fin-list{display:grid;grid-template-columns:max-content 52px 1fr;gap:10px 14px;align-items:center;margin:18px 0}
.fin-list dt{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.fin-list dd{margin:0}
.fin-list .ic svg{width:48px;height:48px;background:var(--moss);border-radius:10px;padding:4px}
.done-text{color:var(--muted);margin:8px 0 0;max-width:56ch}
.locked .skin,.locked .name input{pointer-events:none}
.locked .skin{opacity:.45}
@media (prefers-reduced-motion:reduce){.card .face{transition:none}}
.round-note{background:var(--moss);border:1px solid var(--rose);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:2px;font-size:15px}
.round-note strong{color:var(--rose);font-weight:700}
.grid.wide{grid-template-columns:1fr}
.grid.wide .stage{display:none}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:14px}
.fcard{background:var(--moss);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fcard .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.fcard h3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0;color:var(--lichen)}
.fcard .pic{background:radial-gradient(ellipse at 50% 85%,var(--moss-2),var(--night) 70%);border-radius:12px;padding:6px}
.fcard .pic svg{display:block;width:100%;height:auto;max-height:52vh}
.fcard .fin-list{margin:4px 0 0}
.fin-list dd.changed{color:var(--rose)}
.cmp-actions{margin-top:18px}
#dBody .meaning{margin:6px 0 0}
#dBody .todo{color:var(--muted);font-style:italic}
.done-pic{display:none}
.share-note{color:var(--muted);font-size:14px;margin:10px 0 0;max-width:56ch}
.meanings{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.meanings h3.mh{font-family:var(--display);font-weight:400;font-size:20px;color:var(--lichen);margin:0 0 12px}
.mean{display:grid;grid-template-columns:56px 1fr;gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.mean:last-child{border-bottom:0}
.mean svg{grid-row:span 2;width:56px;height:56px;background:var(--moss);border-radius:10px;padding:4px}
.mean .mcat{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.mean h4{margin:0;font-size:18px;color:var(--ink)}
.mean .mtext{grid-column:2;max-width:68ch}.mean .mtext p{margin:6px 0 0}.mean .mtext.todo{color:var(--muted);font-style:italic}
.mean p.todo{color:var(--muted);font-style:italic}
.rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1)}
.flit{animation:flit 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:flit 4.2s ease-in-out infinite}
@keyframes flit{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{from{transform:translateY(120px);opacity:0}to{transform:none;opacity:1}}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted var(--lichen);text-decoration-thickness:2px;text-underline-offset:3px}
.term[aria-expanded="true"]{color:var(--lichen)}
.term:focus-visible{outline:2px solid var(--lichen);outline-offset:2px;border-radius:2px}
.gloss{background:var(--night);border-left:3px solid var(--rose);border-radius:8px;padding:10px 12px;margin:0 0 10px;font-size:15px;max-width:62ch}
.gloss strong{display:block;color:var(--rose);font-size:13px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.gloss p{margin:0 0 6px}
.hdr-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang-toggle{font:inherit;font-size:13px;font-weight:700;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.lang-toggle:hover{border-color:var(--lichen)}
.lang-toggle:focus-visible{outline:3px solid var(--lichen);outline-offset:2px}
.lang-pick{background:radial-gradient(ellipse at 50% 85%,var(--moss-2),var(--moss) 70%);border:1px solid var(--line);border-radius:14px;padding:32px 20px;text-align:center;max-width:560px;margin:40px auto}
.lang-pick h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;color:var(--lichen);margin:0}
.lang-pick p{color:var(--muted);margin:6px 0 22px}
.lang-pick .actions{justify-content:center;margin-top:0}
.lang-pick .btn{min-width:150px}
@media (prefers-reduced-motion:reduce){.rise,.flit,.bob{animation:none}.item{transition:none}.item:hover{transform:none}}
</style>

<div class="wrap">
  <header>
    <h1>Choose your fighter</h1>
    <div class="hdr-right"><div class="sub" data-i="sub">Transfloratie · contextprogramma</div><button class="lang-toggle" id="langToggle" type="button" hidden>English</button></div>
  </header>

  <section class="lang-pick" id="langPick" aria-labelledby="lpTitle">
    <h2 id="lpTitle" lang="nl">Kies je taal</h2>
    <p lang="en">Choose your language</p>
    <div class="actions">
      <button class="btn primary" type="button" data-lang="nl" lang="nl">Nederlands</button>
      <button class="btn primary" type="button" data-lang="en" lang="en">English</button>
    </div>
  </section>

  <div class="grid" hidden>
    <section class="stage" aria-label="Jouw fighter" data-ia="yourFighter">

function capeFilter(id,fid){const cv=CAPE_COL[id],c=Array.isArray(cv)?cv[0]:cv,cs=Array.isArray(cv)?cv[1]:null;const bl=[0x5a,0x6a,0x9a].map(v=>v/255);
 const v=[1,3,5].map((i,j)=>{const t=parseInt(c.substr(i,2),16)/255,sh=cs?parseInt(cs.substr(i,2),16)/255:.75*t*.68+.25*bl[j],k=(t-sh)/(.91-.62),o=t-k*.91;return `${k.toFixed(3)} 0 0 0 ${o.toFixed(3)}`});

function chainSvg(){
 const q=(a,b,c,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*b[1]+t*t*c[1]];
 const segs=[[[45,6],[20,46],[42,64]],[[42,64],[66,46],[55,6]],[[42,64],[40,82],[47,98]]];
 const links=[];
 segs.forEach((s,si)=>{let prev=q(...s,0),acc=si==2?2.6:0;for(let i=1;i<=200;i++){const p=q(...s,i/200);acc+=Math.hypot(p[0]-prev[0],p[1]-prev[1]);

 const el=(l,i,st,w)=>`<ellipse cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" rx="3.9" ry="${i%2?1.1:2.5}" transform="rotate(${l[2].toFixed(0)} ${l[0].toFixed(1)} ${l[1].toFixed(1)})" fill="none" stroke="${st}" stroke-width="${w}"/>`;

  herkomst:'Volgens de wereldwijde ultraconservatieve katholieke beweging TFP (Traditie, Familie & Privé-eigendom) staat rood voor heldendom, het bloed van de martelaren, zelfopoffering en het Heilig Hart van Jezus.'},
 {id:'goud',cat:'vlag',name:'Gouden cape',svg:capeIcon('goud'),
  herkomst:'Volgens de wereldwijde ultraconservatieve katholieke beweging TFP (Traditie, Familie & Privé-eigendom) staat goud voor de edelmoedigheid van hun strijd voor het herstel van de christelijke beschaving. Het is de kleur van hun leeuw.'},
 {id:'wit',cat:'vlag',name:'Witte cape',svg:capeIcon('wit'),
  herkomst:'In ultraconservatieve kringen staat wit voor zuiverheid en kuisheid. Op de transgendervlag, die Monica Helms in 1999 ontwierp, staat de witte middenbaan voor mensen die intersekse zijn, die in transitie zijn, of die zich in geen enkel gender herkennen.'},
 {id:'zwart',cat:'vlag',name:'Zwarte cape',svg:capeIcon('zwart'),
  herkomst:'Zwart is de kleur van het ceremoniële habijt van de wereldwijde ultraconservatieve katholieke beweging TFP (Traditie, Familie & Privé-eigendom). Volgens de beweging laat dat habijt drie kanten van een lid zien: slaaf van Onze-Lieve-Vrouw, strijder en monnik.\n\nIn queer vlaggen staat zwart voor alle genders buiten het traditionele man-vrouwhokje, van een derde gender tot het hele non-binaire spectrum.'},

 {id:'lavendel',cat:'vlag',name:'Lavendelkleurige cape',svg:capeIcon('lavendel'),

  herkomst:'De fleur-de-lis, een gestileerde lelie, bekroont de standaard van de ultraconservatieve katholieke beweging TFP (Traditie, Familie & Privé-eigendom). Volgens de beweging staat hij voor wijsheid, zuiverheid en ridderlijkheid, en wijst hij naar de hemel.'},
 {id:'driehoek',cat:'embleem',name:'Roze driehoek',svg:'<polygon points="10,86 90,86 50,14" fill="#f08bb4"/>',
  herkomst:'Tijdens de Tweede Wereldoorlog kwamen naar schatting enkele duizenden homoseksuele mannen in de nazi-concentratiekampen terecht, waar ze een roze driehoek op hun kleding moesten dragen, met de punt naar beneden.\n\nVanaf de jaren zeventig eiste de homobeweging het teken op. De Amerikaanse actiegroep ACT UP draaide de driehoek in 1987 om, met de punt omhoog, als teken van verzet. Hun leus Silence = Death eiste dat er niet langer werd gezwegen over aids.\n\nDe naam van Roze Zaterdag, de oudste Nederlandse Pride-dag, verwijst naar de roze driehoek. Het Homomonument in Amsterdam (1987) bestaat uit drie driehoeken van roze graniet.'},

  herkomst:'Bij het ceremoniële habijt van de ultraconservatieve katholieke beweging TFP (Traditie, Familie & Privé-eigendom) draagt men geen koord om het middel maar een grote ketting. Aan de linkerkant hangen drie of zeven schakels: drie voor Maria als dochter, moeder en echtgenote van God, zeven voor haar zeven smarten of vreugden. Aan de ketting hangt een rozenkrans, die gelovigen overal gebruiken; TFP noemt hem het spirituele wapen.'},

  herkomst:'De roos staat al eeuwen voor vriendschap, liefde en rouw. Tegenwoordig is de roos ook een symbool van de transgemeenschap, naar de uitspraak: geef ons onze rozen nu we er nog zijn. Je ziet de roos vooral op Transgender Day of Visibility, als herinnering aan de mensen die de transgemeenschap verloor door geweld tegen trans personen en door transfobie die mensen tegen zichzelf keren.'},

  herkomst:'Het bekendste symbool van TFP (Traditie, Familie & Privé-eigendom) is een gouden, steigerende leeuw met een rood kruis op de borst. Volgens TFP stapt hun leeuw op de vijand af en kijkt hij naar links, naar liberalisme en communisme. De klauwen staan klaar voor de fysieke strijd, terwijl de open bek en de tong laten zien hoe belangrijk het is om de strijd om ideeën te voeren en te winnen. Zijn blik is niet gericht op de tegenstander vlak voor hem, maar op het oneindige: op de verheven zaak waarvoor hij vecht.'},

  herkomst:'Van rups via cocon naar vlinder: de vlinder is een veelgebruikt symbool voor transformatie en voor gendertransitie.\n\nIn de cocon valt het lichaam van de rups grotendeels uiteen en bouwt het zich opnieuw op. Toch blijft het hetzelfde dier. Voor veel trans personen past dat bij hoe zij hun transitie beleven: niet als het worden van iemand anders, maar als het eindelijk tevoorschijn komen van wie ze al waren.'},

async function makeImage(list){try{await document.fonts.load('40px Bungee')}catch(e){}
  const n=list.length,colW=900,W=colW*n+60*(n+1),c=document.createElement('canvas'),x=c.getContext('2d');
  const BF='"Atkinson Hyperlegible",system-ui,sans-serif',wrap=(txt,w,f)=>{x.font=f;const ls=[];txt.split(/\n\n+/).forEach((pa,pi)=>{if(pi)ls.push('');let l='';pa.split(' ').forEach(wd=>{const tt=l?l+' '+wd:wd;if(x.measureText(tt).width>w&&l){ls.push(l);l=wd}else l=tt});if(l)ls.push(l)});return ls};
  const its=chosenItems(list),blocks=its.map(it=>({it,ls:wrap(meaningOf(it)||t('todo'),W-120,'30px '+BF)}));
  const mH=110+blocks.reduce((s,b)=>s+64+b.ls.length*42+34,0)+70,H=1420+mH;c.width=W;c.height=H;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#13284d');g.addColorStop(1,'#0c1a33');x.fillStyle=g;x.fillRect(0,0,W,H);
  for(let i=0;i<n;i++){const f=list[i],x0=60+i*(colW+60);
    x.fillStyle='#a6b6d2';x.font='600 30px '+BF;if(n>1)x.fillText((i?t('second'):t('first')).toUpperCase(),x0,96);
    x.fillStyle='#c6dd7f';x.font='64px Bungee,"Arial Black",sans-serif';x.fillText(f.name,x0,n>1?170:140);
    const im=await svgToImg(f.svg),ih=Math.min(980,colW*im.height/im.width),iw=ih*im.width/im.height;x.drawImage(im,x0+(colW-iw)/2,200,iw,ih);const ly=200+ih+80;
    x.font='34px '+BF;
    CATS.forEach((ct,k)=>{const it=byId(f.picks[ct.id]);x.fillStyle='#a6b6d2';x.fillText(clabel(ct),x0,ly+k*52);x.fillStyle='#eef2e3';x.fillText(iname(it),x0+260,ly+k*52)})}
  let y=1420;x.fillStyle='#2e548c';x.fillRect(60,y-40,W-120,2);
  x.fillStyle='#c6dd7f';x.font='44px Bungee,"Arial Black",sans-serif';x.fillText(t('meanings'),60,y+30);y+=110;
  blocks.forEach(b=>{x.fillStyle='#a6b6d2';x.font='600 24px '+BF;x.fillText(clabel(CATS.find(cc=>cc.id===b.it.cat)).toUpperCase(),60,y);
    x.fillStyle='#eef2e3';x.font='700 36px '+BF;x.fillText(iname(b.it),60,y+42);y+=64+18;
    x.font='30px '+BF;x.fillStyle='#d8e0ee';b.ls.forEach(l=>{x.fillText(l,60,y);y+=42});y+=34-18});
  x.fillStyle='#a6b6d2';x.font='26px '+BF;x.fillText('Choose your fighter · Transfloratie',60,H-36);
  return new Promise(r=>c.toBlob(r,'image/png'))}
function currentList(){return round===2&&fighters[1]?fighters:[fighters[0]]}
function fileName(){return 'fighter-'+(fighters[0].name||t('my')).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.png'}
function downloadBlob(b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fileName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function mailText(){return currentList().map((f,i,arr)=>(arr.length>1?(i?t('second'):t('first'))+': ':t('myFighter')+': ')+f.name+'\n'+CATS.map(ct=>'- '+clabel(ct)+': '+iname(byId(f.picks[ct.id]))).join('\n')).join('\n\n')+'\n\n'+t('meanings').toUpperCase()+'\n\n'+chosenItems(currentList()).map(it=>iname(it).toUpperCase()+'\n'+(meaningOf(it)||t('todo'))).join('\n\n')+'\n\nChoose your fighter · Transfloratie'}
function note(msg){document.querySelectorAll('.share-note').forEach(e=>e.remove());const v=$('rvCompare').hidden?$('rvDone'):$('rvCompare');const p=document.createElement('p');p.className='share-note';p.textContent=msg;v.appendChild(p)}
async function onSave(){const b=await makeImage(currentList());downloadBlob(b);note(t('noteSaved'))}
async function onShare(){const b=await makeImage(currentList());const file=new File([b],fileName(),{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:t('myFighter'),text:mailText()});return}catch(e){if(e.name==='AbortError')return}}
  downloadBlob(b);location.href='mailto:?subject='+encodeURIComponent(t('myFighter')+': '+fighters[0].name)+'&body='+encodeURIComponent(mailText()+'\n\n'+t('attachNote'));
  note(t('noteMail'))}
document.querySelectorAll('[data-save]').forEach(b=>b.onclick=onSave);
document.querySelectorAll('[data-share]').forEach(b=>b.onclick=onShare);

const SKINS=[['licht','#f3d6c2','Huidtint 1'],['orig','#e8b89d','Huidtint 2'],['getint','#d9a27c','Huidtint 3'],['bruin','#b07a52','Huidtint 4'],['donker','#7d4f33','Huidtint 5'],['diep','#4f3122','Huidtint 6']];
let skinSel='orig';
function renderSkin(){
  $('skinSw').innerHTML=SKINS.map(([id,c,l])=>`<button type="button" class="sw" data-s="${id}" style="background:${c}" aria-label="${t('skinTone',SKINS.findIndex(s=>s[0]===id)+1)}" aria-pressed="${skinSel===id}"></button>`).join('');
  const g=$('skin');
  if(skinSel==='orig'){g.style.display='none';return}
  const c=SKINS.find(s=>s[0]===skinSel)[1],tc=[1,3,5].map(i=>parseInt(c.substr(i,2),16)/255),lum=.2126*tc[0]+.7152*tc[1]+.0722*tc[2],gm=1+Math.max(0,.75-lum)*1.5,L0=Math.pow(.756,gm),k=tc.map(v=>v/L0);
  const L1=.756,hl=.12+.4*Math.min(1,lum/.8),tv=[];for(let i=0;i<=20;i++){const x=i/20;tv.push(x<=L1?Math.pow(x/L1,gm):1+(x-L1)/(1-L1)*hl)}
  const top=1+hl,tvs=tv.map(v=>(v/top).toFixed(4)).join(' ');['sgR','sgG','sgB'].forEach(id=>$(id).setAttribute('tableValues',tvs));
  const kk=tc.map(v=>v*top);
  $('skinfm').setAttribute('values',`${kk[0].toFixed(4)} 0 0 0 0 0 ${kk[1].toFixed(4)} 0 0 0 0 0 ${kk[2].toFixed(4)} 0 0 0 0 0 1 0`);
  const im=$('skinimg');if(im.getAttribute('href')==='#')im.setAttribute('href',document.getElementById('body').getAttribute('href'));
  g.style.display='';
}
$('skinSw').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;skinSel=b.dataset.s;renderSkin()});
renderSkin();
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{$('langPick').hidden=true;document.querySelector('.grid').hidden=false;$('langToggle').hidden=false;setLang(b.dataset.lang);window.scrollTo(0,0)});
$('langToggle').onclick=()=>setLang(LANG==='nl'?'en':'nl');
</script>
